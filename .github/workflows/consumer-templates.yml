name: Consumer templates

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @beaket/ui build
      - name: Render every component in a stock Next.js server page
        run: node scripts/test-next-consumer.mjs

  catalog:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.catalog.outputs.components }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: catalog
        run: node -e 'console.log("components=" + JSON.stringify(require("./registry/registry.json").components.map(c => c.name)))' >> "$GITHUB_OUTPUT"

  vite:
    needs: catalog
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [react-ts]
        component: ${{ fromJSON(needs.catalog.outputs.components) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @beaket/ui build
      - name: Install one component into the unmodified stock template
        run: node scripts/test-vite-consumer.mjs "$COMPONENT" "$TEMPLATE"
        env:
          COMPONENT: ${{ matrix.component }}
          TEMPLATE: ${{ matrix.template }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: consumer-lint-${{ matrix.component }}
          path: test-results/consumer-*.json
