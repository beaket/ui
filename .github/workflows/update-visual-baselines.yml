name: Update visual baselines

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write

jobs:
  version:
    if: >-
      github.event.label.name == 'visual-baseline-update' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - id: playwright
        # The container must ship the browser build this Playwright expects.
        # Reading it from package.json keeps one version, not four.
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"

  update:
    needs: version
    runs-on: ubuntu-latest
    # Baselines must be drawn by the same browser build that verifies them.
    container: mcr.microsoft.com/playwright:v${{ needs.version.outputs.playwright }}-noble
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install
      - run: pnpm test:visual:update
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git add tests/__screenshots__
          git diff --cached --quiet || git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot] commit -m "test: update visual baselines"
          git push
