name: Update visual baselines

on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  version:
    if: >-
      github.event.label.name == 'visual-baseline-update' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - id: playwright
        # The container must ship the browser build this Playwright expects.
        # Reading it from package.json keeps one version, not four.
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"

  update:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Baselines must be drawn by the same browser build that verifies them.
    container: mcr.microsoft.com/playwright:v${{ needs.version.outputs.playwright }}-noble
    steps:
      # Push as Beaket Bunsen, not with GITHUB_TOKEN: a push made with the workflow's own token
      # starts no workflows, so the required checks never ran on the baseline commit and the pull
      # request could not merge.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.BUNSEN_APP_ID }}
          private-key: ${{ secrets.BUNSEN_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install
      - run: pnpm test:visual:update
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git add tests/__screenshots__
          git diff --cached --quiet || git -c user.name="beaket-bunsen[bot]" -c user.email="340865321+beaket-bunsen[bot]@users.noreply.github.com" commit -m "test: update visual baselines"
          git push

  unlabel:
    # The update runs only when the label is added, so take it off to allow the next refresh.
    needs: [version, update]
    if: always() && needs.version.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label visual-baseline-update
