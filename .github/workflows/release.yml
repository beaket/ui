name: Release

on:
  push:
    branches:
      - main
    # Deliberately no `paths` filter. This workflow does two jobs, and only one
    # of them is about package content:
    #
    #   1. publish when main has no changesets left, and
    #   2. keep the release PR rebased on main.
    #
    # (2) depends on all of main, not a subset of it. With a paths filter, a
    # push that misses the list leaves the release PR sitting on a stale base
    # until some unrelated change happens to touch `src/**` — and a stale base
    # is invisible until the release PR's checks fail against a tree nobody is
    # looking at. That is exactly how #893's fix failed to reach #882.
    #
    # The run is cheap when there is nothing to do, and `concurrency` below
    # collapses bursts, so the filter was buying very little.

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
      id-token: write # OIDC for npm publish provenance
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          pr-title: "Changes Included in the Next Release"
          commit-message: "chore: version packages"
          publish-script: pnpm run release
        env:
          # For @changesets/changelog-github, not for the action. `changeset
          # version` renders changelogs through it, and it throws without
          # GITHUB_TOKEN in the environment. The action takes its own token
          # through the `github-token` input (default: github.token).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance comes from a patch to @changesets/cli that appends
          # `--provenance` to its publish flags — see .npmrc for why. Do NOT
          # add NPM_CONFIG_PROVENANCE here; pnpm ignores it.

      - name: Create check run for Release PR
        if: steps.changesets.outputs.pr-number
        uses: actions/github-script@v9
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ steps.changesets.outputs.pr-number }}
            });

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'check',
              head_sha: pr.data.head.sha,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: 'Release PR Check',
                summary: 'Automatically approved for Release PR created by changesets'
              }
            });
