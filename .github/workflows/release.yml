name: Release

# Releases are weekly (docs/MAINTENANCE.md § Releases). This workflow does two jobs:
#
#   1. Rebuild the release PR from every pending changeset, then start Bunsen's
#      release review. Weekly on schedule, or by hand for an urgent release such
#      as a security fix. The reviewer's approval merges the PR.
#   2. Publish when a merged release PR lands on main.
#
# A push to main never rebuilds the release PR. Rebuilding on every push
# restarted the PR's checks, each held for the maintainer's approval, on every
# merge. A stale base is not the risk it was when #893's fix failed to reach
# #882: the rebuild runs right before the review, on the main of that moment.
on:
  schedule:
    # Thursday 09:17 UTC+9. Early, because an approval publishes: hours of
    # GitHub delay should still land the release in working hours.
    - cron: "17 0 * * 4"
  workflow_dispatch:
  push:
    branches:
      - main
    # Only a merged release PR, which writes the changelogs, has anything to
    # publish. A changelog fix on its own publishes nothing.
    paths:
      - "packages/*/CHANGELOG.md"

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
      actions: write # start the release review in bunsen.yml
      id-token: write # OIDC for npm publish provenance
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install

      # A push publishes the release PR that was just merged, and nothing else.
      # Changesets merged after the weekly rebuild wait for the next one. Set
      # aside here (the files stay on main), changesets/action sees none and
      # publishes; otherwise it would rebuild the release PR instead.
      - name: Set later changesets aside
        if: github.event_name == 'push'
        run: find .changeset -maxdepth 1 -name '*.md' ! -name README.md -delete

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          pr-title: "Changes Included in the Next Release"
          commit-message: "chore: version packages"
          publish-script: pnpm run release
        env:
          # For @changesets/changelog-github, not for the action. `changeset
          # version` renders changelogs through it, and it throws without
          # GITHUB_TOKEN in the environment. The action takes its own token
          # through the `github-token` input (default: github.token).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance comes from a patch to @changesets/cli that appends
          # `--provenance` to its publish flags — see .npmrc for why. Do NOT
          # add NPM_CONFIG_PROVENANCE here; pnpm ignores it.

      - name: Create check run for Release PR
        if: steps.changesets.outputs.pr-number
        uses: actions/github-script@v9
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ steps.changesets.outputs.pr-number }}
            });

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'check',
              head_sha: pr.data.head.sha,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: 'Release PR Check',
                summary: 'Automatically approved for Release PR created by changesets'
              }
            });

      # The workflow's own token may start another workflow by dispatch.
      - name: Start the release review
        if: github.event_name != 'push' && steps.changesets.outputs.pr-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bunsen.yml --repo "$GITHUB_REPOSITORY" --ref main -f job=release
