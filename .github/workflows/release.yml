name: Release

on:
  push:
    branches:
      - main
    # Deliberately no `paths` filter. This workflow does two jobs, and only one
    # of them is about package content:
    #
    #   1. publish when main has no changesets left, and
    #   2. keep the release PR rebased on main.
    #
    # (2) depends on all of main, not a subset of it. With a paths filter, a
    # push that misses the list leaves the release PR sitting on a stale base
    # until some unrelated change happens to touch `src/**` — and a stale base
    # is invisible until the release PR's checks fail against a tree nobody is
    # looking at. That is exactly how #893's fix failed to reach #882.
    #
    # The run is cheap when there is nothing to do, and `concurrency` below
    # collapses bursts, so the filter was buying very little.

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
      id-token: write # OIDC for npm publish provenance
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install

      - name: Create Release Pull Request or Publish
        id: changesets
        # v2 requires @changesets/cli v3 and uses a different input contract.
        # Keep the action on v1 while our patched CLI remains on v2.
        uses: changesets/action@v1
        with:
          title: "Changes Included in the Next Release"
          commit: "chore: version packages"
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance is enabled via `provenance=true` in the repo-root .npmrc —
          # pnpm ignores NPM_CONFIG_PROVENANCE, so do NOT re-add it here.

      - name: Create check run for Release PR
        if: steps.changesets.outputs.pullRequestNumber
        uses: actions/github-script@v9
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ steps.changesets.outputs.pullRequestNumber }}
            });

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'check',
              head_sha: pr.data.head.sha,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: 'Release PR Check',
                summary: 'Automatically approved for Release PR created by changesets'
              }
            });

  docs:
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
