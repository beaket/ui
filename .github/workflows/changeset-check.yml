name: Changeset Check

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "packages/**"

jobs:
  check:
    if: |
      !startsWith(github.head_ref, 'changeset-release/') &&
      !startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: npx @changesets/cli status --since=origin/main
