name: Docs

on:
  # Deploy from main directly. The only automated path used to be release.yml's
  # `docs` job, gated on `needs.release.outputs.published == 'true'` — and that
  # output comes from changesets/action@v1 parsing the publish command's stdout.
  # The CLI is now v3, whose output is the clack style ("◇  Successfully
  # published:"), which v1 cannot parse, so `published` is never 'true' and the
  # job has been silently skipping. Every recent docs deploy was a manual
  # workflow_dispatch.
  #
  # main's `packages/cli/package.json` always holds the published version — the
  # bump lands in the release commit — so docs built from main always describe
  # the released package. There is nothing for a publish signal to add.
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build docs and check public bundle boundary
        run: pnpm docs:bundle:report
      - name: Build @beaket/paper
        run: pnpm --filter @beaket/paper build
      - name: Build Paper site
        run: pnpm --filter paper-site build
      - name: Nest Paper site under /ui/paper
        run: |
          mkdir -p docs/dist/paper
          cp -R sites/paper/dist/. docs/dist/paper/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
