name: Docs

on:
  # Deploy from main directly. main's `packages/cli/package.json` always holds
  # the published version — the bump lands in the release commit — so docs built
  # from main always describe the released package. There is nothing a publish
  # signal could add. (The old path was a release.yml `docs` job gated on the
  # changesets action's `published` output, which silently skipped for months.)
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build docs and check public bundle boundary
        run: pnpm docs:bundle:report
      - name: Build @beaket/paper
        run: pnpm --filter @beaket/paper build
      - name: Build Paper site
        run: pnpm --filter paper-site build
      - name: Nest Paper site under /ui/paper
        run: |
          mkdir -p docs/dist/paper
          cp -R sites/paper/dist/. docs/dist/paper/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
