name: Docs

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build docs
        run: pnpm --filter docs build
      - name: Build @beaket/paper
        run: pnpm --filter @beaket/paper build
      - name: Build Paper site
        run: pnpm --filter paper-site build
      - name: Nest Paper site under /ui/paper
        run: |
          mkdir -p docs/dist/paper
          cp -R sites/paper/dist/. docs/dist/paper/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
