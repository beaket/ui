name: Visual regression

on:
  pull_request:
  push:
    branches: [main]
    paths:
      [
        ".github/workflows/visual-regression.yml",
        "docs/**",
        "src/**",
        "registry/**",
        ".storybook/**",
        "package.json",
        "pnpm-lock.yaml",
        "playwright.visual.config.ts",
        "tests/**",
      ]

permissions:
  contents: read

jobs:
  selection:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.selection.outputs.mode }}
      components: ${{ steps.selection.outputs.components }}
      docs: ${{ steps.selection.outputs.docs }}
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: playwright
        # The container must ship the browser build this Playwright expects.
        # Reading it from package.json keeps one version, not four.
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: selection
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin '${{ github.event.pull_request.base.sha }}'
          node scripts/select-visual-tests.mjs '${{ github.event.pull_request.base.sha }}' '${{ github.event.pull_request.head.sha }}' >> "$GITHUB_OUTPUT"

  screenshots:
    needs: selection
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v${{ needs.selection.outputs.playwright }}-noble
    steps:
      - name: No visual changes
        if: github.event_name == 'pull_request' && needs.selection.outputs.mode == 'skip'
        run: echo "No visual changes to test."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request' || needs.selection.outputs.mode != 'skip'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: github.event_name != 'pull_request' || needs.selection.outputs.mode != 'skip'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name != 'pull_request' || needs.selection.outputs.mode != 'skip'
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install
        if: github.event_name != 'pull_request' || needs.selection.outputs.mode != 'skip'
      - run: pnpm test:visual
        if: github.event_name != 'pull_request' || needs.selection.outputs.mode != 'skip'
        env:
          VISUAL_TEST_MODE: ${{ needs.selection.outputs.mode }}
          VISUAL_COMPONENTS: ${{ needs.selection.outputs.components }}
          VISUAL_DOCS: ${{ needs.selection.outputs.docs }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && (github.event_name != 'pull_request' || needs.selection.outputs.mode != 'skip')
        with:
          name: visual-regression-diff
          path: test-results/visual
          retention-days: 14
