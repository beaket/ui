name: CI
# Accessibility contract: docs/a11y-automated-check-contract.md

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Check theme-tokens.json is in sync with src/themes/*.css
        run: |
          pnpm --filter docs exec tsx scripts/generate-theme-tokens.ts
          git diff --exit-code docs/src/data/theme-tokens.json
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Install Chromium for browser-backed theme tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Test semantic theme contrast
        run: pnpm test:contrast
      - name: Test component accessibility
        run: pnpm test:a11y:components
      - name: Test documentation accessibility
        run: pnpm test:a11y:docs
      - name: Check docs bundle boundary
        run: pnpm docs:bundle:report
      - name: Summarize accessibility evidence
        if: always()
        run: node scripts/report-a11y-evidence.mjs
      - name: Publish accessibility evidence
        if: always() && hashFiles('test-results/*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-evidence
          path: test-results/
      - name: Add accessibility evidence to job summary
        if: always() && hashFiles('test-results/a11y-summary.md') != ''
        run: cat test-results/a11y-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Test CLI
        run: pnpm test:cli
      - name: Test CLI units
        run: pnpm test:cli:unit
      - name: Test Editor
        run: pnpm test:editor
      - name: Check ADR references resolve
        run: pnpm check:adr
